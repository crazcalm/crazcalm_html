<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lab 8</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.css" rel="stylesheet"
        crossorigin="anonymous">
</head>

<body class="container text-center">
    <header>
        <h1>DevPortal|Intermediate JS Lab</h1>
    </header>
    <main>
        <div class="row justify-content-around">
            <div class="card col-12 col-lg-4 col-md-6 my-2" id="dynamic-service-registry-card">
                <h5 class="card-header">Active System Modules</h5>
                <div class="card-body">
                    <ul class="list-group list-group-flush" id="module-list">
                    </ul>
                </div>
            </div>

            <div class="card col-12 col-lg-4 col-md-6 my-2" id="theme-switcher-card">
                <h5 class="card-header">Theme Switcher</h5>
                <div class="card-body">
                    <p class="card-text">Current Theme</p>
                    <button class="btn btn-primary" id="toggle-btn">Toggle theme</button>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.js"
        crossorigin="anonymous"></script>
    <script>
        const themeToggleBtn = document.querySelector("#toggle-btn");
        const html = document.querySelector("html");
        const systemModuleCard = document.querySelector("#dynamic-service-registry-card");
        const themeSwitcherCard = document.querySelector("#theme-switcher-card");


        class SystemModules {
            moduleListQuerySelector = "#module-list";
            moduleListArray = [
                { "name": "Authentication Engine", "badge": "Mostly works" },
                { "name": "Database Connector", "badge": "Never lies" },
                { "name": "Cloud Storage API", "badge": "Bill due soon" },
                { "name": "Logging Service", "badge": "Life Saver" }
            ];

            constructor(card) {
                this.card = card;
            }

            getModuleListElement() {
                return this.card.querySelector(this.moduleListQuerySelector);
            }

            buildModuleListUI() {
                let list_ui = this.getModuleListElement();

                this.moduleListArray.forEach((item) => {
                    let li = document.createElement("li");
                    let span = document.createElement("span");

                    li.textContent = `${item.name} `;
                    li.classList.add("list-group-item");
                    span.textContent = item.badge;
                    span.classList.add("badge");
                    span.classList.add("rounded-pill");
                    span.classList.add("text-bg-primary");
                    li.appendChild(span);
                    list_ui.append(li);
                })
            }

            setUp() {
                this.buildModuleListUI();
            }
        }

        class ThemeSwitcher {
            constructor(card) {
                this.card = card;
            }

            updatedTheme() {
                let currentTheme = html.getAttribute("data-bs-theme");
                let text = `Current Theme: ${currentTheme}`;
                this.card.querySelector(".card-text").textContent = text;
                console.log(`New current theme is ${currentTheme}`);
            }

            setUp() {
                this.updatedTheme();
            }
        }

        console.log("Initializing classes and calling setup methods start");
        let systemModules = new SystemModules(systemModuleCard);
        systemModules.setUp();

        let themeSwitcher = new ThemeSwitcher(themeSwitcherCard);
        themeSwitcher.setUp();
        console.log("Initializing classes and calling setup methods end");


        function themeToggleHandler() {
            /*
            The initial implementation used the classList toggle method for
            changing the themes, but I couldn't get the card header background right.
            So I used bootstraps native light and dark theme solution instead.

            docs: https://getbootstrap.com/docs/5.3/customize/color-modes/
            */
            console.log("theme toggle button Handler start");
            let currentTheme = html.getAttribute("data-bs-theme");
            if (currentTheme === "light") {
                html.setAttribute("data-bs-theme", "dark");
            } else {
                html.setAttribute("data-bs-theme", "light");
            }

            themeSwitcher.updatedTheme();

            console.log("theme toggle button Handler end");
        }

        themeToggleBtn.addEventListener("click", themeToggleHandler);
    </script>
</body>

</html>
