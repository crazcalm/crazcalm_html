<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Video Games</title>
</head>

<body class="container">
    <header>
        <image
            src="https://cdn.creativefabrica.com/2023/05/08/Video-Game-Controller-Logo-Graphics-69127373-1-580x387.png">
            <h1>My Video Game Playlist</h1>
    </header>
    <aside>
        <nav>
            <a href="#games-to-experience">Games to Experience</a>
            <a href="#recommended-by-friends">Games Recommended by Friends</a>
            <a href="#games-to-finish">Games to Finish Playing</a>
            <a href="#games-played-by-friends">Games Friends Play</a>
        </nav>
    </aside>
    <main>
        <article id="games-to-experience">
            <h2>Games I want to Experience</h2>
            <div class="games">
                <img src="https://assets-prd.ignimgs.com/2021/12/30/assassins-creed-1-button-1640894408253.jpg">
                <img src="https://image.api.playstation.com/vulcan/ap/rnd/202111/3013/cKZ4tKNFj9C00giTzYtH8PF1.png">
            </div>
        </article>
        <article id="recommended-by-friends">
            <h2>Recommended by Friends</h2>
            <div class="games">
                <img src="https://cdn.mobygames.com/covers/3694843-hollow-knight-nintendo-switch-front-cover.jpg">
                <img src="https://cdn.mobygames.com/covers/10143432-resident-evil-2-playstation-4-front-cover.jpg">
            </div>
        </article>
        <article id="games-to-finish">
            <h2>Games I want to Finish</h2>
            <div class="games">
                <img src="https://media.vgm.io/releases/70/21607/21607-1697533040.jpg">
                <img src="https://i.pinimg.com/736x/6c/f6/8e/6cf68ecc18c2e33a6d3be6ad0f0c0c38.jpg">
                <img src="https://assets-prd.ignimgs.com/2024/06/09/southofmidnight-1717954178704.jpg">
            </div>
        </article>
        <article id="games-played-by-friends">
            <h2>Games Played by Friends</h2>
            <div class="games">
                <img src="https://cdn.mobygames.com/covers/7778776-guilty-gear-playstation-4-front-cover.jpg">
            </div>
        </article>
    </main>
</body>

</html>
